name: Security Worker tests

on:
  pull_request:
    paths:
      - "security-worker/**"
      - ".github/workflows/security-worker-tests.yml"
  push:
    branches:
      - main
      - security/harden-secrets-api
    paths:
      - "security-worker/**"
      - ".github/workflows/security-worker-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Worker tests
        run: npm test
